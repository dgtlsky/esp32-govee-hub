; Classic ESP32 dev boards (ESP32-WROOM-32 / ESP32-D0WD, 4 MB flash).
; Upload/monitor ports are auto-detected; scripts/hub.py passes --upload-port explicitly.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = no_ota.csv
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7
